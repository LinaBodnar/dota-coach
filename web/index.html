<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota Coach</title>
  <meta name="description" content="Персональний дата-коуч для Dota 2: встав Match ID — отримай розбір катки.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 4 7v8c0 8 5 13 12 15 7-2 12-7 12-15V7z' fill='%23e5483f'/></svg>">
  <style>
    .gh{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--text);text-decoration:none}
    .gh:hover{border-color:var(--muted)}
    .me{display:flex;align-items:center;gap:10px;padding:8px 4px 0}
    .me img{width:34px;height:34px;border-radius:9px;background:var(--bg2)}
    .me b{display:block;font-size:13.5px}.me small{color:var(--muted);font-size:11.5px}
    .side-title button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
    .side-title button:hover{color:var(--text)}
    .list.short{flex:none}
    .mi .gbadge.dim{color:var(--dim);font-size:13px}
    .hintbox{font-size:12.5px;color:var(--muted);background:var(--bg2);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#" id="home">
      <svg viewBox="0 0 32 32" width="30" height="30"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset="1" stop-color="#b3201a"/></linearGradient></defs><path d="M16 2 4 7v8c0 8 5 13 12 15 7-2 12-7 12-15V7z" fill="url(#lg)"/><path d="M11 10l10 12M21 10 11 22" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".92"/></svg>
      <span>DOTA<b>COACH</b></span>
    </a>
    <div class="top-right">
      <a class="gh" href="https://github.com/LinaBodnar/dota-coach" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        Версія з LIVE
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <form class="import" id="importForm">
        <label>Розібрати катку</label>
        <div class="row">
          <input id="matchIdInput" placeholder="Match ID або посилання" autocomplete="off">
          <button type="submit" class="btn btn-red" id="importBtn">Аналіз</button>
        </div>
        <small>Працює з будь-якою публічною каткою</small>
      </form>

      <div class="import">
        <label>Твій Steam / Friend ID</label>
        <input id="accountInput" placeholder="напр. 123456789 або посилання на профіль" autocomplete="off">
        <div class="me hidden" id="me"></div>
      </div>

      <div class="side-title">Розібрані <span id="count"></span></div>
      <div class="list short" id="list"></div>

      <div class="side-title" id="recentTitle">Останні катки <button id="recentReload" title="Оновити">↻ оновити</button></div>
      <div class="list" id="recent"></div>
    </aside>
    <main id="main"></main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/analyzer.js"></script>
  <script src="/normalize.js"></script>
  <script src="/report.js"></script>
  <script src="/web.js"></script>
</body>
</html>
